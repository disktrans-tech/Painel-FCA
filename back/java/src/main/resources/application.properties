# Configuração da aplicação — só referências a variáveis de ambiente
# (${VAR} ou ${VAR:valor-padrao}), NENHUM valor real. Este arquivo pode
# ser commitado com segurança: os segredos de verdade vêm do ambiente
# (.env local carregado no shell, ou variáveis do serviço de deploy).
# Veja o .env.example na raiz do projeto para a lista de variáveis.

server.address=${API_HOST:0.0.0.0}
server.port=${API_PORT:8000}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Origem(ns) do frontend que podem chamar a API (CORS), separadas por vírgula
app.cors-origins=${API_CORS_ORIGINS:http://localhost:5500}

# Ambiente: local | homologacao | producao
app.ambiente=${AMBIENTE:local}
