# =============================================================================
# .github/workflows/pages.yml
# Publica a pasta front/ no GitHub Pages a cada push na main.
# Pré-requisito (uma vez): Settings → Pages → Source = "GitHub Actions".
# =============================================================================

name: Publicar painel (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar front/
        uses: actions/upload-pages-artifact@v3
        with:
          path: front

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
